[project]
name = "salesdata-api"
version = "0.1.0"
description = "A FastAPI application for sales data."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "passlib[bcrypt]",
    "python-jose[cryptography]",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-exporter-prometheus",
    "prometheus-client",
    "psycopg2-binary",
    "starlette",
    "PyJWT",
    "httpx",
    "orjson",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
select = [ "E", "F", "I", "W", "C90", "N", "UP", "A", "B", "C4", "DTZ", "T10", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "RUF",]
ignore = [ "B905", "B008",]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = [ "PLR2004", "S101",]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = [ "core",]
